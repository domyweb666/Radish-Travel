# XcodeGen 的專案定義。Xcode 專案檔不進 git，CI 每次用這份產生：
#   brew install xcodegen && cd ios && xcodegen generate
# 加 Swift 檔不用動這裡，資料夾裡的檔會自動收進去。
name: Radish
options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Radish:
    type: application
    platform: iOS
    sources:
      - path: Radish
      # 規則引擎直接編進 app，跟 app 同一個模組（Package.swift 只給 Linux 上的 swift test 用）
      - path: RadishCore/Sources/RadishCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.radish
        PRODUCT_NAME: Radish
        # 模組名字不能叫 Radish：畫面裡有一個叫 Radish 的 View（蘿蔔），同名會擋到限定名
        PRODUCT_MODULE_NAME: RadishTravel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        RADISH_AI_ENDPOINT: ""
      configs:
        # 送 TestFlight 用的 Release：手動簽章，描述檔由 CI 每次向 Apple 申請（ios/ci/appstore_profile.mjs）。
        # 描述檔名字要跟 .github/workflows/ios.yml 的 PROFILE_NAME 一字不差。
        # 模擬器的 Debug 不受影響。
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Radish CI App Store
    info:
      path: Radish/Info.plist
      properties:
        CFBundleDisplayName: 蘿蔔旅行
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [nmap]
        NSLocationWhenInUseUsageDescription: 打開地圖按「我在哪」的時候，用來在地圖上標出你的位置。
        # 平常的我 → 連電腦的 Claude CLI（開發測試用）：掃電腦上的 QR code、連區網裡的電腦
        NSCameraUsageDescription: 掃電腦上的 QR code，連到你自己電腦的 Claude CLI。只在你按「掃 QR code」時用。
        NSLocalNetworkUsageDescription: 連到同一個 Wi-Fi 裡你自己的電腦，用那台電腦的 Claude CLI 回答。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 「用講的改行程」的 AI 後端網址。空的就只用本機指令
        RadishAIEndpoint: $(RADISH_AI_ENDPOINT)

  RadishUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RadishUITests
    dependencies:
      - target: Radish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.radish.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Radish

schemes:
  Radish:
    build:
      targets:
        Radish: all
        RadishUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RadishUITests
