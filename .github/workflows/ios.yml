# 送 TestFlight 的線。照人蔘修煉（Ginseng-Cultivation）那條抄的，踩過的坑都留在註解裡。
#   1. Linux：規則引擎測試
#   2. macOS：產生專案 → 還原憑證到暫時鑰匙圈 → 向 Apple 申請描述檔 → archive → 直傳 App Store Connect
#             → 不管成敗都刪鑰匙圈
#   3. Linux：等 Apple 處理完建置，填 TestFlight 測試說明
# 什麼時候跑：推一個 tf- 開頭的標籤（例如 tf-1），或到 GitHub 的 Actions 頁手動按。
# 平常推程式只跑 ios-check.yml，不會多出 TestFlight 版本。
# 安全：secrets 只進環境變數、不 echo；fork 的 PR 拿不到 secrets（GitHub 預設）。
# 要先放好六個 secrets，並在 Apple 後台登記 App ID、建 app 記錄，步驟在 ios/ci/README.md。
name: iOS TestFlight

on:
  push:
    tags: ["tf-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: org.domyweb.radish
  # CI 每次向 Apple 申請的上架用描述檔叫這個名字（ios/ci/appstore_profile.mjs）。
  # 要跟 ios/project.yml 裡 Release 的 PROVISIONING_PROFILE_SPECIFIER 一字不差。
  PROFILE_NAME: Radish CI App Store
  TESTFLIGHT_NOTES: "0.5.0 主要是：首爾的地點查過一輪，排行程會看休館日和開放時段。「挑一間」那種都換成真的店，現在一共 71 個地點，讀過官方頁的 28 個、二手資料 40 個、沒查到 3 個，一站頁會寫是哪一種。都是 AI 上網查的，樂天世界、Seoul Sky、愛寶樂園、清溪川的官網讀不到。排行程、換一個、附近會避開不開的日子和時段；移站、跟 AI 講了改還是放得進去，但會講哪一站不開。同一類的店一趟只排一間，挑不到才放寬。要先訂的改成一站一則提醒：開賣前 15 分鐘（台灣時間）、免費取消的最後一天，其他的併成一則。檢查這趟的 K-ETA 和電子入境卡會照你到的那天寫。精緻餐廳改用晚餐價，花費預估可能比以前高。以前排好的那趟不會自己換店，要看新的請開一趟新的。請試：開兩三趟不同日期的，看有沒有排到休館的站，晚上和白天有沒有空著；把景福宮移到星期二，看它怎麼講；檢查這趟按「提醒我去訂」，看第一則的時間，真的等一則跳出來（現在沒有聲音，要不要加請跟我說）；昌德宮與後苑的訂票頁開不開得了；給司機看有沒有韓文地址；字放大，看移到別的時段和檢查這趟有沒有被切。哪一站寫錯了，把站名傳給我就好。還沒在手機上試過的：拔蘿蔔的震動、提醒通知、地圖上我在哪、掃 QR、做成網頁傳出去、真的問 AI。"

jobs:
  core-tests:
    name: 規則引擎測試（Linux）
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path ios/RadishCore

  ios-build:
    name: 建置並上傳 TestFlight（macOS）
    needs: core-tests
    # Apple 現在只收用 iOS 26 SDK（Xcode 26）編的 app，所以機器跟 Xcode 都用 26。
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # runner.temp 在 job 層級的 env 不能用，所以用第一個 step 寫進 GITHUB_ENV
      - name: 設暫存路徑
        run: |
          {
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/radish-ci.keychain-db"
            echo "AUTH_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/Radish.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/export"
          } >> "$GITHUB_ENV"

      - name: 六個 secrets 都放了嗎
        env:
          HAS_P12: ${{ secrets.APPLE_DIST_P12_BASE64 != '' }}
          HAS_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD != '' }}
          HAS_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_KEY: ${{ secrets.ASC_KEY_P8_BASE64 != '' || secrets.ASC_PRIVATE_KEY != '' }}
          HAS_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ISSUER: ${{ secrets.ASC_ISSUER_ID != '' }}
        run: |
          MISSING=""
          [ "$HAS_P12" = "true" ] || MISSING="$MISSING APPLE_DIST_P12_BASE64"
          [ "$HAS_P12_PASSWORD" = "true" ] || MISSING="$MISSING APPLE_DIST_P12_PASSWORD"
          [ "$HAS_TEAM" = "true" ] || MISSING="$MISSING APPLE_TEAM_ID"
          [ "$HAS_KEY" = "true" ] || MISSING="$MISSING ASC_KEY_P8_BASE64（或 ASC_PRIVATE_KEY）"
          [ "$HAS_KEY_ID" = "true" ] || MISSING="$MISSING ASC_KEY_ID"
          [ "$HAS_ISSUER" = "true" ] || MISSING="$MISSING ASC_ISSUER_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::還沒放的 secret：$MISSING。步驟在 ios/ci/README.md。"
            exit 1
          fi
          echo "六個 secrets 都在"

      - name: 選 Xcode 26
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: 產生 Xcode 專案
        working-directory: ios
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: 還原發佈憑證到暫時鑰匙圈
        env:
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # .p12 裡如果已經帶著 Apple 的中繼憑證，後面再匯一次會回
          # 「The specified item already exists in the keychain」而整步變紅。
          # 所以「已經在裡面」當成過，其他錯誤照樣紅；最後用 find-identity 把關。
          import_into_keychain() {
            local label="$1"
            shift
            echo "匯入：$label"
            if ! security import "$@" 2> "$RUNNER_TEMP/import.err"; then
              if grep -q "already exists" "$RUNNER_TEMP/import.err"; then
                echo "  已經在鑰匙圈裡，略過"
              else
                cat "$RUNNER_TEMP/import.err" >&2
                return 1
              fi
            fi
          }
          P12_PATH="$RUNNER_TEMP/dist.p12"
          printf '%s' "$APPLE_DIST_P12_BASE64" | base64 --decode > "$P12_PATH"
          import_into_keychain "發佈憑證 .p12" "$P12_PATH" -P "$APPLE_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"
          # Apple 的中繼憑證（簽章鏈要完整，codesign 才認得發佈憑證）
          curl -sSfL -o "$RUNNER_TEMP/wwdr-g3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -sSfL -o "$RUNNER_TEMP/wwdr-g4.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer
          import_into_keychain "Apple 中繼憑證 G3" "$RUNNER_TEMP/wwdr-g3.cer" -k "$KEYCHAIN_PATH" -A
          import_into_keychain "Apple 中繼憑證 G4" "$RUNNER_TEMP/wwdr-g4.cer" -k "$KEYCHAIN_PATH" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "$IDENTITIES"
          if ! grep -q "Apple Distribution" <<< "$IDENTITIES"; then
            echo "::error::鑰匙圈裡沒有可用的 Apple Distribution 簽章身分（.p12 或它的密碼不對）"
            exit 1
          fi

      - name: 還原 App Store Connect API 金鑰
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash ios/ci/restore_asc_key.sh "$AUTH_KEY_PATH"

      # 簽章全程手動：自己向 Apple 申請上架用描述檔，用鑰匙圈裡那張 Apple Distribution 憑證簽。
      # 不走自動簽章的兩個原因（人蔘修煉踩過）：
      #   1. 匯出走自動簽章時 Xcode 會要雲端簽章，App Manager 等級的 API 金鑰沒有權限。
      #   2. archive 走自動簽章時，這台用完就丟的機器每跑一次都向 Apple 要一張新的開發憑證，
      #      累積到帳號上限後全帳號的自動簽章都會紅。
      - name: 向 Apple 申請上架用描述檔
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          CERT_SERIAL="$(security find-certificate -c "Apple Distribution" -p "$KEYCHAIN_PATH" | openssl x509 -noout -serial | cut -d= -f2)"
          export CERT_SERIAL
          ASC_KEY_P8_PATH="$AUTH_KEY_PATH" node ios/ci/appstore_profile.mjs

      - name: archive（手動簽章，用上一步的描述檔）
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/Radish.xcodeproj \
            -scheme Radish \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: 上傳 App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          sed -e "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" \
            -e "s/BUNDLE_ID_PLACEHOLDER/$BUNDLE_ID/" \
            -e "s/PROFILE_NAME_PLACEHOLDER/$PROFILE_NAME/" \
            ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: 刪鑰匙圈與金鑰（不管成敗）
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$AUTH_KEY_PATH" "$RUNNER_TEMP/dist.p12"

  testflight-notes:
    name: 填 TestFlight 測試說明
    needs: ios-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: 設暫存路徑
        run: echo "ASC_KEY_P8_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 還原 API 金鑰
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash ios/ci/restore_asc_key.sh "$ASC_KEY_P8_PATH"
      - name: 等處理完並填說明
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node ios/ci/testflight_notes.mjs
      - name: 刪金鑰（不管成敗）
        if: always()
        run: rm -f "$ASC_KEY_P8_PATH"
