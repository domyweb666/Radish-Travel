<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>蘿蔔旅行 手感原型</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000; --sub:rgba(60,60,67,.6); --line:rgba(60,60,67,.18);
  --main:#FF9500; --mainText:#fff; --soil:#C9A27A; --leaf:#34C759; --chip:#E9E9EE; --red:#FF3B30; --yel:#FFCC00;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1C1C1E; --text:#fff; --sub:rgba(235,235,245,.6); --line:rgba(84,84,88,.6);
    --main:#FF9F0A; --soil:#6B5138; --chip:#2C2C2E; --leaf:#30D158; --red:#FF453A; --yel:#FFD60A; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:17px;line-height:1.4}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.pages{display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar,.scrollx::-webkit-scrollbar{display:none}
.pages.lock{overflow-x:hidden}
.page{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;padding:54px 16px 120px;max-width:100vw}
.wrap{max-width:460px;margin:0 auto}
.dots{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.dots button{width:8px;height:8px;border-radius:50%;background:var(--line);position:relative}
.dots button.on{background:var(--text)}
.dots button::after{content:"";position:absolute;inset:-12px -4px}
h1{font-size:34px;font-weight:700;margin:6px 4px 0}
.subt{color:var(--sub);margin:2px 4px 18px}
h2{font-size:22px;font-weight:700;margin:26px 4px 10px}
.card{background:var(--card);border-radius:26px;padding:18px;margin-bottom:14px}
.card.flush{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 18px;position:relative;width:100%;text-align:left}
.row + .row::before,.row + .leg::before,.leg + .row::before{content:"";position:absolute;top:0;left:18px;right:0;height:.5px;background:var(--line)}
.row .grow{flex:1;min-width:0}
.row .val{color:var(--sub);white-space:nowrap}
.small{font-size:13px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--sub);margin:0 6px 6px 0;vertical-align:middle}
.tag.book{background:rgba(255,149,0,.16);color:var(--main)}
.tag.ok{background:rgba(52,199,89,.16);color:var(--leaf)}
.tag.red{background:rgba(255,59,48,.15);color:var(--red)}
.tag.yel{background:rgba(255,204,0,.22);color:#A07800}
@media (prefers-color-scheme: dark){.tag.yel{color:var(--yel)}}
.where{font-size:13px;color:var(--sub);font-weight:600}
.name{font-size:24px;font-weight:700;margin:4px 0 10px}
.kr{font-size:13px;color:var(--sub)}
.note{font-size:15px;color:var(--sub);margin-top:4px}
.btn{display:block;width:100%;height:56px;border-radius:999px;background:var(--main);color:var(--mainText);font-weight:700;font-size:19px;margin-top:16px;text-align:center;line-height:56px;text-decoration:none}
.btn:active{transform:scale(.98)}
.pair{display:flex;gap:10px;margin-top:10px}
.pill{flex:1;height:44px;border-radius:999px;background:var(--chip);font-weight:600;font-size:15px;text-align:center;line-height:44px;text-decoration:none;color:var(--text);white-space:nowrap}
.pill.on{background:var(--main);color:#fff}
.mini{display:inline-block;height:32px;line-height:32px;padding:0 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;margin:8px 8px 0 0;text-decoration:none;color:var(--text)}
.link{display:block;margin:6px auto 0;color:var(--sub);font-size:15px;padding:10px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px;margin-top:8px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.scrollx > *{flex:0 0 auto}
.dayp{min-width:52px;height:40px;border-radius:999px;background:var(--card);font-weight:700;font-size:15px;padding:0 14px}
.dayp.on{background:var(--main);color:#fff}
.q{font-size:20px;font-weight:700;margin:0 0 4px}
/* 對話 */
.bub{max-width:86%;padding:12px 16px;border-radius:22px;margin:0 0 8px;font-size:17px;animation:fade .25s ease-out both;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.bot{background:var(--card);border-bottom-left-radius:8px;width:fit-content}
.bub.me{background:var(--main);color:#fff;margin-left:auto;border-bottom-right-radius:8px;font-weight:600;width:fit-content}
.bub.sys{background:none;color:var(--sub);font-size:13px;padding:2px 6px;max-width:100%}
.opts{margin-top:14px}
.opts button{display:block;width:100%;min-height:54px;border-radius:999px;background:var(--card);font-size:18px;font-weight:600;margin-bottom:10px;border:1.5px solid var(--line);animation:fade .25s ease-out both}
.opts button:active{background:var(--chip)}
.opts.inline{display:flex;gap:8px;flex-wrap:wrap}
.opts.inline button{flex:1 0 56px}
.thread{max-height:44dvh;min-height:120px;overflow-y:auto;padding:4px 0 6px}
.sheet .thread .bub.bot{background:var(--card)}
.sendrow{display:flex;gap:8px;margin-top:10px}
.sendrow input{flex:1;height:52px;border-radius:999px;padding:0 20px;font-size:17px}
.sendrow button{flex:0 0 52px;height:52px;border-radius:50%;background:var(--main);color:#fff;font-size:22px;font-weight:700}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 田 */
.field{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:6px;align-items:stretch}
.field .hd{font-size:12px;color:var(--sub);text-align:center;font-weight:600;padding-bottom:2px}
.field .dl{font-size:13px;color:var(--sub);font-weight:700;display:flex;align-items:center}
.hole{position:relative;height:62px;border-radius:16px;background:var(--bg);display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:9px;overflow:hidden}
.hole::after{content:"";position:absolute;left:8px;right:8px;bottom:5px;height:13px;border-radius:50%;background:var(--soil)}
.hole.off{opacity:.35}
.hole.off::after{display:none}
.hole.cur{outline:2.5px solid var(--main);outline-offset:-2.5px}
.hole svg{position:relative;z-index:1;width:26px;height:36px}
.hole svg.L{width:30px;height:42px}
.hole .rest{position:absolute;top:5px;right:7px;font-size:10px;font-weight:700;color:var(--sub);z-index:2}
.hole .offt{font-size:11px;color:var(--sub);align-self:center}
@keyframes pop{0%{transform:scale(.1) translateY(16px)}60%{transform:scale(1.25) translateY(-6px)}100%{transform:scale(1) translateY(0)}}
@keyframes pull{0%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-8deg)}100%{transform:translateY(-70px) rotate(10deg);opacity:0}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.pull{animation:pull .55s ease-in forwards}
@media (prefers-reduced-motion: reduce){.pop,.pull,.bub,.opts button{animation:none}}
.leg{position:relative;padding:8px 18px 8px 30px;font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center}
.leg b{color:var(--text);font-weight:600}
.leg i{width:2px;height:18px;background:var(--line);border-radius:1px;flex:0 0 2px;margin-right:8px}
.route{display:block;width:100%;height:120px;background:var(--bg);border-radius:16px}
#map{height:56dvh;border-radius:20px;overflow:hidden;background:var(--chip)}
.mk{width:26px;height:26px;border-radius:50%;background:#FF9500;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mk.h{background:#000}.mk.me{background:#007AFF;width:18px;height:18px}
.sum{display:flex;justify-content:space-between;padding:6px 0}
.sum.total{font-weight:700;font-size:20px;border-top:.5px solid var(--line);margin-top:8px;padding-top:12px}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;display:flex;margin:10px 0 4px}
.bar span{display:block;height:100%}
.lv{display:inline-flex;align-items:center;font-size:15px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--sub);margin:0 8px 8px 0}
.lv.l1{background:rgba(255,149,0,.16);color:var(--main)}
.lv.l2{background:var(--main);color:#fff}
.ic{width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:flex;align-items:center;justify-content:center}
.ic svg{width:22px;height:22px}
.big{font-size:38px;font-weight:700;text-align:center;line-height:1.25;padding:26px 8px;word-break:keep-all}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);
  padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;transition:all .25s;z-index:30;max-width:86vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.back{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:34px 34px 0 0;z-index:11;padding:10px 16px calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-height:92dvh;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;margin:0 4px 12px}
input[type=text],textarea{width:100%;font:inherit;font-size:20px;color:var(--text);background:var(--card);border:0;border-radius:16px;padding:16px;outline:none}
textarea{font-size:13px;height:110px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 26px;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--leaf);border-color:var(--leaf)}
.chk.on::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ico{width:26px;height:34px;flex:0 0 26px}
.loading{text-align:center;padding:40px 0;color:var(--sub)}
</style>
</head>

function cost(){
  const t=T(), st=S.settings, n=t.people||1, nights=Math.max(t.days-1,0);
  const items=allItems().map(x=>x.it);
  const stay=nights*st.stayBudget/(n>=2?2:1);
  const fineExtra=items.filter(i=>i.c==='eat').reduce((s,i)=>s+(i.fee||0),0);
  const food=t.days*st.budget+fineExtra;
  const ticket=items.filter(i=>i.c!=='eat').reduce((s,i)=>s+(+i.fee||0),0);
  let move=600; for(let d=1;d<=t.days;d++) dayLegs(d).forEach(l=>{if(l) move+=l.mode==='計程車'?l.cost/n:l.cost;});
  const pre=700, flight=t.flight||0;
  const rows=[['住宿',stay,`${nights} 晚 × ${money(st.stayBudget)}${n>=2?'，兩人分':''}`],['吃喝',food,`${t.days} 天 × ${money(st.budget)}${fineExtra?'，名店另加 '+money(fineExtra):''}`],['門票與體驗',ticket,'行程裡要付費的項目加總'],['交通',move,'市內移動＋機場來回'],['行前',pre,'網卡、旅遊險'],['機票',flight,flight?'你自己填的':'還沒填']];
  return {rows,total:rows.reduce((s,r)=>s+r[1],0),n};
}

}

  redo(){draft={i:0,ans:{}};renderMain();},
  see(){S.tab='plan';render();goPage(0);},
  chat(){openSheet(`<h3>跟 AI 討論行程</h3><div id="chatbox">${chatBody()}</div><button class="link" data-act="close">關掉，看改好的行程</button>`); const t=$('thread'); if(t) t.scrollTop=t.scrollHeight;},
  send(){const i=$('msg'); if(!i) return; const v=i.value.trim(); if(!v||busy) return; askAI(v);},
  chip(el){if(!busy) askAI(el.dataset.t);},
  undo(){if(!undoSnap) return; const o=JSON.parse(undoSnap); S.trip=o.trip; S.seeds=o.seeds; undoSnap=null; S.chat.push({r:'sys',t:'復原了上一步。'}); render(); renderChat();},
  newtrip(){openSheet(`<h3>整趟重來？</h3><div class="card"><div class="note">這份行程會不見，設定和收藏會留著。</div></div><button class="btn" data-act="newOk">重來</button><button class="link" data-act="close">取消</button>`);},
  newOk(){S.trip=null;S.chat=[];draft={i:0,ans:{}};closeSheet();render();},
  depart(){T().phase='trip';T().today=1;render();toast('定了。路上不用再比了。');},
  replan(){T().phase='plan';render();},
  slot(el){
    const s=T().slots[+el.dataset.i];
    openSheet(`<h3>第 ${s.day} 天 ${PART[s.part]}</h3>${s.items.map(it=>`<div class="card"><div style="display:flex;gap:12px;align-items:center">${icon(it)}<div><b>${esc(it.n)}</b>${it.kr?`<div class="kr">${esc(it.kr)}</div>`:''}<div class="small">${kind(it)}・${areaOf(it)}</div></div></div><div style="margin-top:10px">${tags(it)}</div>${it.tip?`<div class="small">須知：${esc(it.tip)}</div>`:''}
      ${it.status==='kept'?`<div class="pair"><button class="pill" data-act="map" data-id="${it.id}">地圖</button><button class="pill" data-act="mv" data-id="${it.id}">移走</button><button class="pill" data-act="swap" data-id="${it.id}">換一個</button></div><button class="link" data-act="later" data-id="${it.id}">這次不去，放到下次再來</button>`:''}</div>`).join('')}${s.rest?'<div class="card"><b>留白</b><div class="small">這段不排東西</div></div>':''}${!s.items.length&&!s.rest?'<div class="card"><div class="note">空坑</div></div>':''}<button class="link" data-act="close">關掉</button>`);
  },
  later(el){const x=findItem(el.dataset.id); if(!x) return; seedOut(x.it,x.s); closeSheet(); render(); toast('放到「下次再來」了。');},
  mv(el){
    const x=findItem(el.dataset.id); if(!x) return; mvDraft={id:x.it.id,day:x.s.day,part:x.s.part}; ACT.mvShow();
  },
  mvShow(){
    const x=findItem(mvDraft.id), t=T(); if(!x) return;
    openSheet(`<h3>把「${esc(x.it.n)}」移到</h3><div class="scrollx">${Array.from({length:t.days},(_,i)=>`<button class="dayp ${mvDraft.day===i+1?'on':''}" data-act="mvd" data-d="${i+1}">第 ${i+1} 天</button>`).join('')}</div>
      <div class="pair" style="margin-top:14px">${['am','pm','eve'].map(p=>{const ok=slotAt(mvDraft.day,p);return `<button class="pill ${mvDraft.part===p&&ok?'on':''}" ${ok?`data-act="mvp" data-p="${p}"`:'style="opacity:.35"'}>${PART[p]}${ok?'':'（在路上）'}</button>`;}).join('')}</div>
      <p class="small" style="padding:10px 6px 0">第 ${mvDraft.day} 天現在有 ${bigCount(mvDraft.day)} 個大行程、${dayStops(mvDraft.day).length} 站。</p>
      <button class="btn" data-act="mvOk">移過去</button><button class="link" data-act="close">取消</button>`);
  },
  mvd(el){mvDraft.day=+el.dataset.d; if(!slotAt(mvDraft.day,mvDraft.part)){const p=['am','pm','eve'].find(p=>slotAt(mvDraft.day,p)); if(p) mvDraft.part=p;} ACT.mvShow();},
  mvp(el){mvDraft.part=el.dataset.p; ACT.mvShow();},
  mvOk(){const err=moveItem(mvDraft.id,mvDraft.day,mvDraft.part); closeSheet(); if(err){toast(err);return;} S.planDay=mvDraft.day; render(); const w=warnings(); toast(w[0]||`移到第 ${mvDraft.day} 天${PART[mvDraft.part]}了。`);},
  swapap(el){const err=swapParts(+el.dataset.d,'am','pm'); render(); toast(err||'上午和下午對調了。');},
  pday(el){S.planDay=+el.dataset.d;render();$('pOther').scrollTop=0;},
  daymap(el){openMap(+el.dataset.d);},
  locate(){
    if(!Lmap) return; if(!navigator.geolocation){toast('這支手機沒開放定位。');return;}
    toast('找你在哪…');
    let me=null;
    watchId=navigator.geolocation.watchPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude]; if(!Lmap) return; if(!me){me=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="mk me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(Lmap).bindPopup('你在這裡'); Lmap.setView(ll,14);} else me.setLatLng(ll);},
      ()=>toast('拿不到位置。到設定裡允許這個網頁用定位。'),{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
  },
  fit(){if(Lmap&&Lmap._fitAll) Lmap._fitAll();},
  swap(el){
    const x=findItem(el.dataset.id); if(!x) return; const {it}=x;
    if(it.swaps>=3){openSheet(`<h3>先停一下</h3><div class="card"><div class="note">這個坑已經換過三輪了。前面那幾個都合你的條件，挑一個就好。想要完全不同的，到「跟 AI 討論」裡直接說。</div></div><button class="btn" data-act="close">好</button>`);return;}
    const used=usedIds(), w=weights(T().purpose), ar=AREA[it.a]?[it.a,...ADJ[it.a]]:Object.keys(AREA);
    const alts=P.filter(p=>!used.has(p.id)&&ar.includes(p.a)&&p.s===it.s&&(it.c!=='eat'||p.c==='eat')).sort((a,b)=>w[b.c]-w[a.c]).slice(0,3);
    if(!alts.length){toast('這一區沒有別的候選了。');return;}
    openSheet(`<h3>把「${esc(it.n)}」換成？</h3><div class="card flush">${alts.map(p=>`<button class="row" data-act="swapTo" data-id="${p.id}" data-from="${it.id}">${icon(p)}<div class="grow">${esc(p.n)}<div class="small">${kind(p)}・${AREA[p.a]}${p.b?'・要先訂':''}${p.fee?'・約 '+money(p.fee):''}</div></div><span class="val">›</span></button>`).join('')}</div><button class="link" data-act="close">不換了</button>`);
  },
  swapTo(el){
    const x=findItem(el.dataset.from), p=P.find(q=>q.id===el.dataset.id); if(!x||!p) return;
    x.s.items[x.s.items.indexOf(x.it)]={...p,status:'kept',swaps:x.it.swaps+1,_fx:'pop'}; closeSheet(); render(); toast('換好了。');
  },
  map(el){
    const x=findItem(el.dataset.id); if(!x) return; const it=x.it;
    if(!it.kr){openSheet(`<h3>${esc(it.n)}</h3><div class="card"><div class="note">${it.mine?'這是你自己加的點，原型不知道它在哪。':'這一項原型只排到「哪一區、吃哪一種」，還沒有指定店家。'}正式版會由 AI 給店名、韓文地址和地圖連結。</div></div><button class="btn" data-act="close">好</button>`);return;}
    const q=encodeURIComponent(it.kr);
    openSheet(`<h3>${esc(it.n)}</h3><div class="card"><div class="small">韓文名稱（給司機或路人看）</div><div class="big">${esc(it.kr)}</div>
      <div class="pair" style="margin-top:0"><button class="pill" data-act="copy" data-t="${esc(it.kr)}">複製韓文</button><button class="pill" data-act="show" data-t="${esc(it.kr)}">放大給司機看</button></div></div>
      <div class="card flush">
        <a class="row" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="grow">用 Naver 地圖找路<div class="small">韓國當地最常用，會顯示你的位置</div></span><span class="val">›</span></a>
        <a class="row" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="grow">用 Google 地圖開</span><span class="val">›</span></a>
        <a class="row" href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="grow">用 Apple 地圖開</span><span class="val">›</span></a></div>
      <p class="small" style="padding:0 6px">原型只有韓文名稱，沒有門牌地址。正式版會從地圖資料帶出完整韓文地址。</p><button class="link" data-act="close">關掉</button>`);
  },
  copy(el){const t=el.dataset.t; try{navigator.clipboard.writeText(t).then(()=>toast('複製了：'+t),()=>toast('複製不了，長按上面的韓文。'));}catch(e){toast('複製不了，長按上面的韓文。');}},
  show(el){openSheet(`<div class="card"><div class="big" style="font-size:54px;padding:60px 8px">${esc(el.dataset.t)}</div><div class="small" style="text-align:center">여기로 가 주세요（請到這裡）</div></div><button class="btn" data-act="close">好</button>`);},
  add(){addDraft={};openSheet(`<h3>想去哪？</h3><input type="text" id="addName" placeholder="店名或地方" maxlength="30" autocomplete="off"><button class="btn" data-act="add2">下一步</button>`);setTimeout(()=>{const i=$('addName');i&&i.focus();},300);},
  add2(){const v=($('addName').value||'').trim(); if(!v){toast('先打個名字。');return;} addDraft.n=v;
    openSheet(`<h3>${esc(v)}</h3><div class="card"><p class="q">換一個類似的地方，可以嗎？</p></div><div class="opts"><button data-act="add3" data-k="1">可以</button><button data-act="add3" data-k="0">不行，就是要這個</button></div>`);},
  add3(el){
    if(el.dataset.k==='1'){S.pool.push(addDraft.n);closeSheet();render();toast('放進「順路可去」，現場想到再去。');return;}
    openSheet(`<h3>${esc(addDraft.n)}</h3><div class="card"><p class="q">它有非去不可的時間嗎？</p><p class="small">例如訂位、定時票、只有某天開</p></div><div class="opts"><button data-act="add4" data-k="1">有</button><button data-act="add4" data-k="0">沒有</button></div>`);},
  add4(el){
    const t=T();
    const slot=t.slots.filter(s=>!s.off&&s.part!=='eve'&&s.day>1&&s.day<t.days&&bigCount(s.day)<2).sort((x,y)=>x.items.length-y.items.length)[0];
    const it={id:'m'+Date.now(),n:addDraft.n,kr:'',a:'',s:'L',c:'sight',b:el.dataset.k==='1'?1:0,mine:true,status:'kept',swaps:0,_fx:'pop'};
    closeSheet();
    if(slot){slot.items.push(it);slot.rest=false;S.planDay=slot.day;render();toast(`種在第 ${slot.day} 天${PART[slot.part]}${it.b?'，記得訂好時間':''}。`);}
    else{S.seeds.unshift({n:it.n,a:'自己加的',why:'坑滿了'});render();toast('坑滿了，先放到下次再來。');}
  },
  day(el){T().today=+el.dataset.d;render();},
  next(){T().today++;render();},
  pull(){
    const x=dayStops(T().today).map(x=>x.it).find(it=>it.status==='kept'); if(!x) return;
    pulling=x; x._fx='pull'; renderMain();
    setTimeout(()=>openSheet(`<h3>${esc(x.n)}</h3><div class="card"><p class="q">這裡，最想講的一件事？</p><p class="small">一句就好，不寫也可以</p></div><input type="text" id="say" maxlength="60" autocomplete="off" placeholder="例如：湯比想像中清"><button class="btn" data-act="pullOk">收進籃子</button>`),450);
  },
  pullOk(){if(!pulling) return; pulling.say=($('say').value||'').trim(); pulling.status='pulled'; pulling=null; closeSheet(); render(); toast(pick(PULL));},
  skip(){const x=dayStops(T().today).find(x=>x.it.status==='kept'); if(x) seedOut(x.it,x.s,'旅途中說不去了'); render(); toast('好，放到下次再來。');},
  tired(){
    const x=dayStops(T().today).find(x=>x.it.status==='kept'&&x.it.s==='L'); if(x) seedOut(x.it,x.s,'那天太累');
    render(); toast(x?'大的那個先放到下次再來，今天挑輕鬆的就好。':'今天本來就沒排大的，慢慢來。');
  },
  archive(){const t=T(); S.baskets.unshift({title:`首爾 ${t.days} 天`,items:allItems().filter(x=>x.it.status==='pulled').map(x=>({n:x.it.n,s:x.it.s,c:x.it.c,ic:x.it.ic,say:x.it.say}))}); S.trip=null; S.chat=[]; draft={i:0,ans:{}}; render();},
  cleardemo(){S.seeds=S.seeds.filter(s=>!s.demo);S.baskets=S.baskets.filter(b=>!b.demo);render();},
  tab(el){S.tab=el.dataset.k;render();$('pOther').scrollTop=0;},
  sub(el){S.subKnow=el.dataset.k;render();},
  chk(el){S.checks[el.dataset.k]=!S.checks[el.dataset.k];render();},
  set(el){const k=el.dataset.key; S.settings[k]=el.dataset.k; if(k==='stay') S.settings.stayBudget=STAY[el.dataset.k][1]; render();},
  food(el){S.settings.food[el.dataset.k]=+el.dataset.v;render();},
  avoid(el){const a=S.settings.avoid,k=el.dataset.k,i=a.indexOf(k); if(i>=0) a.splice(i,1); else a.push(k); render();},
  bud(el){S.settings.budget=Math.min(10000,Math.max(500,S.settings.budget+500*el.dataset.d));render();},
  meal(el){S.settings.mealMax=Math.min(20000,Math.max(300,S.settings.mealMax+(S.settings.mealMax<2000?300:1000)*el.dataset.d));render();},
  stayb(el){S.settings.stayBudget=Math.min(20000,Math.max(300,S.settings.stayBudget+(S.settings.stayBudget<1500?300:500)*el.dataset.d));render();},
  fly(el){T().flight=Math.min(80000,Math.max(0,(T().flight||0)+ +el.dataset.d));render();},
  play(el){const p=S.settings.play,k=el.dataset.k; p[k]=((p[k]||0)+1)%3; if(!p[k]) delete p[k]; render();},
  export(){
    const txt=JSON.stringify(S);
    const show=()=>openSheet(`<h3>備份</h3><textarea readonly>${esc(txt)}</textarea><p class="small">長按全選後複製，貼到備忘錄存起來。</p><button class="btn" data-act="close">好</button>`);
    try{navigator.clipboard.writeText(txt).then(()=>toast('備份已複製，貼到備忘錄存起來。'),show);}catch(e){show();}
  },
  import(){openSheet(`<h3>貼上備份</h3><textarea id="bkin" placeholder="把之前複製的備份貼在這裡"></textarea><button class="btn" data-act="importOk">還原</button><button class="link" data-act="close">取消</button>`);},
  importOk(){try{const o=JSON.parse($('bkin').value); if(!o.settings) throw 0; S=Object.assign(blank(),o); S.settings=Object.assign(blank().settings,o.settings); closeSheet(); render(); toast('還原好了。');}catch(e){toast('這段不是備份，再貼一次。');}},
  reset(){openSheet(`<h3>全部清掉？</h3><div class="card"><div class="note">行程、收藏、設定都會回到一開始的樣子。</div></div><button class="btn" style="background:var(--red)" data-act="resetOk">清掉</button><button class="link" data-act="close">取消</button>`);},
  resetOk(){S=blank();draft={i:0,ans:{}};undoSnap=null;closeSheet();render();goPage(1);},
  close(){if(pulling){delete pulling._fx;pulling=null;renderMain();} closeSheet();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(el&&ACT[el.dataset.act]){ACT[el.dataset.act](el);return;}
  const d=e.target.closest('[data-go]'); if(d) goPage(+d.dataset.go);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='msg'&&!e.isComposing){e.preventDefault();ACT.send();} });
$('back').addEventListener('click',()=>ACT.close());

/* ========= 三頁左右滑 ========= */
const pages=$('pages'); let pageI=1;
function goPage(i,instant){pages.scrollTo({left:i*pages.clientWidth,behavior:instant?'auto':'smooth'});}
function syncDots(){
  const i=Math.round(pages.scrollLeft/pages.clientWidth);
  if(i!==pageI){pageI=i; if(i===1&&!T()) renderMain();}
  document.querySelectorAll('#dots button').forEach((b,k)=>b.classList.toggle('on',k===i));
}
pages.addEventListener('scroll',syncDots,{passive:true});
window.addEventListener('resize',()=>goPage(pageI,true));
render(); initAI(0);
requestAnimationFrame(()=>{goPage(1,true);syncDots();});
</script>
</body>
</html>
