    <span style="font-size: 34px; line-height: 41px; font-weight: 700;">開一趟</span>

    <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700;">送出之前，先講清楚</h2>
    <p style="margin: 12px 0 0; font-size: 15px; line-height: 22px;">按「同意並送出」之後，這些會送到蘿蔔旅行的伺服器，再轉給 AI 服務（Anthropic 的 Claude）：</p>
    <ul style="margin: 8px 0 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 22px;">
      <li>你講的這句：「下個月去首爾玩 5 天，住明洞附近，想多排咖啡廳和市場，不想太趕」</li>
      <li>這趟的日期、幾點到幾點走、幾個人、住哪一帶</li>
      <li>平常的我裡的習慣。你還沒設的，先照一般的排法</li>
    </ul>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 22px;">AI 提的地點名稱，會拿去 Google 地圖查有沒有這個地方，不帶你的資料。</p>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 22px; font-weight: 600;">不會送：手機的定位、名字、聯絡方式、照片。</p>
    <p style="margin: 6px 0 0; font-size: 13px; line-height: 18px; color: #555555;">只有第一次會問。之後在「平常的我」可以收回。</p>
    <button type="button" style="margin-top: 16px; height: 52px; border-radius: 14px; border: 0; background: #111111; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; outline: 1px dashed #8C8C8C; outline-offset: 3px;">同意並送出</button>

    <p style="margin: 8px 0 0; font-size: 13px; line-height: 18px; color: #555555; text-align: center;">先不要的話，你講的都留著。</p>
